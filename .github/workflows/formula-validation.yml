name: Formula Validation

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'
      - '.github/workflows/formula-validation.yml'
  pull_request:
    paths:
      - 'Formula/**'
      - '.github/workflows/formula-validation.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOMEBREW_NO_INSTALL_FROM_API: "1"

jobs:
  audit:
    name: Brew Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Tap this repository
        run: |
          brew untap slmingol/homebrew-tap 2>/dev/null || true
          brew tap slmingol/homebrew-tap "${{ github.workspace }}"

      - name: Trust tap
        run: brew trust slmingol/homebrew-tap

      - name: Audit formulas
        env:
          HOMEBREW_DEVELOPER: "1"
        run: brew audit --strict slmingol/homebrew-tap/gauth slmingol/homebrew-tap/doxctl slmingol/homebrew-tap/gotcping slmingol/homebrew-tap/gorelease_ex

      - name: Cleanup tap
        if: always()
        run: |
          brew untap slmingol/homebrew-tap 2>/dev/null || true
          rm -rf /home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/slmingol 2>/dev/null || true

  test:
    name: Install & Test (${{ matrix.formula }})
    runs-on: macos-13
    strategy:
      fail-fast: false
      matrix:
        formula: [gauth, doxctl, gotcping, gorelease_ex]

    steps:
      - uses: actions/checkout@v4

      - name: Tap this repository
        run: brew tap slmingol/homebrew-tap "${{ github.workspace }}"

      - name: Trust tap
        run: brew trust slmingol/homebrew-tap

      - name: Install formula
        run: brew install --verbose slmingol/homebrew-tap/${{ matrix.formula }}

      - name: Run brew test
        run: brew test --verbose slmingol/homebrew-tap/${{ matrix.formula }}

      - name: Verify binary in PATH
        run: command -v ${{ matrix.formula }}

      - name: Check for broken dependencies
        run: brew missing slmingol/homebrew-tap/${{ matrix.formula }} || true
